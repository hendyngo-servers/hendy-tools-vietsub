services:
  - type: web
    name: hendy-tools-vietsub-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://hendyngo-servers.github.io,http://localhost:8080,http://127.0.0.1:8080
      - key: LIBRETRANSLATE_URL
        sync: false
      - key: LIBRETRANSLATE_API_KEY
        sync: false
