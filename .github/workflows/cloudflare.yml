name: Deploy static site to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'src/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'worker.js'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - 'version.json'
      - 'tests/**'
      - 'scripts/build-static.cjs'
      - 'package.json'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-static-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Reproduce Cloudflare Workers Builds package installation
        uses: oven-sh/setup-bun@v2
      - name: Confirm Bun install creates the Wrangler asset directory
        run: |
          rm -rf dist
          bun install
          test -f dist/index.html
          node -e "const p=require('./package.json'); const d=require('node:fs'); if (!p.scripts.postinstall || !d.existsSync('dist/version.json')) process.exit(1)"
      - name: Run tests and build
        run: npm run check
      - name: Validate Wrangler configuration and static assets without publishing
        run: npx --yes wrangler@4 deploy --dry-run
      - name: Check Cloudflare credentials are configured
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deploy skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets to enable it."
          fi
      - name: Deploy to Cloudflare Workers static assets
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
