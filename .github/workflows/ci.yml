name: CI
on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python offline workers
        run: python -m py_compile backend/offline_worker.py backend/install_models.py
      - name: Validate JavaScript, tests and public bundle
        run: npm run check
