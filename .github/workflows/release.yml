name: Publish Hendy VietSub release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node -e "const p=require('./package.json'); const expected='v'+p.version; if(process.env.RELEASE_TAG!==expected){console.error('Tag must equal '+expected+', got '+process.env.RELEASE_TAG);process.exit(1)}"
      - name: Run tests and build
        run: npm run check
      - name: Package static frontend ZIP
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd dist
          zip -qr "../hendy-vietsub-web-$RELEASE_TAG.zip" .
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" "hendy-vietsub-web-$RELEASE_TAG.zip" \
            --title "Hendy VietSub $RELEASE_TAG" \
            --generate-notes
