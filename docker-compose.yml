services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hendy-vietsub-offline:2.2.1
    environment:
      NODE_ENV: production
      PORT: "10000"
      ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      OMP_NUM_THREADS: "2"
    ports:
      - "10000:10000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    image: hendy-vietsub-web:2.2.1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
